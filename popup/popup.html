<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT Live Chat Monitor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="bg-orbs" aria-hidden="true">
      <span class="orb orb--1"></span>
      <span class="orb orb--2"></span>
    </div>

    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <span class="logo__bar"></span>
          <span class="logo__bar"></span>
          <span class="logo__bar"></span>
        </div>
        <div class="brand__text">
          <h1>Chat Monitor</h1>
          <p>YouTube live chat tracker</p>
        </div>
      </div>
      <span id="statusPill" class="pill pill--idle">
        <span class="pill__dot"></span><span id="statusLabel">Idle</span>
      </span>
    </header>

    <!-- Live session panel (shown while monitoring) -->
    <section id="livePanel" class="live-panel" hidden>
      <div class="live-panel__row">
        <div class="stat">
          <span class="stat__value" id="liveMatches">0</span>
          <span class="stat__label">Matches</span>
        </div>
        <div class="stat">
          <span class="stat__value" id="liveElapsed">00:00</span>
          <span class="stat__label">Elapsed</span>
        </div>
        <div class="stat">
          <span class="stat__value stat__value--conn" id="liveConn">–</span>
          <span class="stat__label">Chat</span>
        </div>
      </div>
      <div class="live-panel__actions">
        <button id="liveOpenResults" type="button" class="btn btn--soft">
          <svg viewBox="0 0 24 24" class="ico"><path d="M14 3h7v7m0-7L10 14M5 5v14h14v-6"/></svg>
          Results
        </button>
        <button id="liveStop" type="button" class="btn btn--stop">
          <svg viewBox="0 0 24 24" class="ico"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
          Stop
        </button>
      </div>
    </section>

    <form id="monitorForm" class="form">
      <label class="field">
        <span class="field__label">Live stream URL</span>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" class="input-ico"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
          <input id="streamUrl" type="text" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" spellcheck="false" />
        </div>
      </label>

      <label class="field">
        <span class="field__label">Usernames <em>(comma-separated)</em></span>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" class="input-ico"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input id="usernames" type="text" placeholder="e.g. axewelder, another_user" autocomplete="off" spellcheck="false" />
        </div>
        <div id="userChips" class="chips"></div>
      </label>

      <label class="field">
        <span class="field__label">Keywords <em>(comma-separated)</em></span>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" class="input-ico"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="keywords" type="text" placeholder="e.g. giveaway, !win, question" autocomplete="off" spellcheck="false" />
        </div>
        <div id="kwChips" class="chips"></div>
      </label>

      <div class="options">
        <label class="switch">
          <input id="usernameContains" type="checkbox" />
          <span class="switch__track"><span class="switch__thumb"></span></span>
          <span class="switch__text">Partial username match</span>
        </label>
        <label class="switch">
          <input id="caseSensitive" type="checkbox" />
          <span class="switch__track"><span class="switch__thumb"></span></span>
          <span class="switch__text">Case-sensitive keywords</span>
        </label>
        <label class="switch">
          <input id="clearPrevious" type="checkbox" checked />
          <span class="switch__track"><span class="switch__thumb"></span></span>
          <span class="switch__text">Clear previous results on start</span>
        </label>
      </div>

      <p id="hint" class="hint"></p>

      <button id="startBtn" type="submit" class="btn btn--primary btn--block">
        <span class="btn__spinner" aria-hidden="true"></span>
        <span class="btn__label">Start monitoring</span>
      </button>
    </form>

    <button id="openResultsBtn" type="button" class="btn btn--soft btn--block btn--results">
      <svg viewBox="0 0 24 24" class="ico"><path d="M14 3h7v7m0-7L10 14M5 5v14h14v-6"/></svg>
      <span class="btn__label">View results</span>
      <span id="resultsCount" class="btn__count">0</span>
    </button>

    <p class="tip">
      <svg viewBox="0 0 24 24" class="tip__ico"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
      <span>In chat, switch <b>Top chat</b> → <b>Live chat</b> so nothing is filtered out.</span>
    </p>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="popup.js"></script>
  </body>
</html>
